[project]
name = "mogops-training"
version = "0.1.0"
description = "Training pipeline for the MogOps face scoring models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2026.7.22",
    "gdown>=6.4.2",
    "joblib>=1.6.0",
    "mediapipe>=1.1.0",
    "numpy>=2.5.3",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxscript>=0.7.2",
    "open-clip-torch>=3.3.0",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
]
